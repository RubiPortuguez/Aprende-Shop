<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./css/style.css">

    <title>Mi carrito</title>


    
    <!-- Favicon principal en formato SVG -->
    <link rel="icon" href="./assets/favicon/favicon.svg?v=3" type="image/svg+xml">
    <!-- PNG fallback para navegadores que no soportan SVG -->
    <link rel="icon" href="./assets/favicon/favicon.png?v=3" sizes="32x32" type="image/png">
    <!-- Icono para dispositivos Apple (iOS y macOS)  -->
    <link rel="apple-touch-icon" href="./assets/favicon/apple-touch-icon.png?v=3" sizes="180x180">
    <!-- Para pestañas ancladas en Safari macOS -->
    <link rel="mask-icon" href="./assets/favicon/favicon.svg?v=4" color="#000000">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>

<body>

    <br>
    <h2 class="ms-4">Mi carrito</h2>
    <br>

    <div class="container">

        <!-- Barra de progreso -->
        <div class="row">
            <div class="col-10 mx-auto">
                <div class="position-relative mb-4">
                    <div class="progress" role="progressbar" style="height: 1px;">
                        <div class="progress-bar" style="width: 0%"></div>
                    </div>
                    <button type="button"
                        class="position-absolute top-0 start-0 translate-middle btn btn-sm btn-activo rounded-pill"
                        style="width: 2rem; height:2rem;" id="1">1</button>
                    <button type="button"
                        class="position-absolute top-0 start-50 translate-middle btn btn-sm btn-inactivo rounded-pill"
                        style="width: 2rem; height:2rem;" id="2">2</button>
                    <button type="button"
                        class="position-absolute top-0 start-100 translate-middle btn btn-sm btn-inactivo rounded-pill"
                        style="width: 2rem; height:2rem;" id="3">3</button>
                </div>
            </div>
        </div>

        <div class="row">
            <!-- Cards -->
            <div class="col-md-9 mb-4">
                <section>
                    <div id="productosPendientes" class="row row-cols-1 row-cols-md-3 g-3">


                    </div>
                </section>
            </div>

            <!-- Lista -->
            <div class="col-md-3 mb-5 mt-5" id="resumenCompra">
                <aside>
                    <ul class="list-group list-group-flush">
                        <li class="list-group-item d-flex justify-content-between align-items-center">
                            Resumen del carrito
                        </li>
                        <li class="list-group-item d-flex justify-content-between align-items-center border-0">
                            Subtotal
                            <span id="subtotalCarrito">$0.00</span>
                        </li>
                        <li class="list-group-item  d-flex justify-content-between align-items-center border-0">
                            Descuentos
                            <span id="descuentoCarrito">$0.00</span>
                        </li>
                    </ul>
                    <div class="input-group input-group-sm mt-2 px-2">
                        <input type="text" class="form-control border-0  " placeholder="Código de descuento">
                        <button class="btn btn-outline-secondary border-0" type="button"
                            id="button-addon2">Aplicar</button>
                    </div>
                    <div class="d-flex justify-content-between align-items-center mt-3 px-2 py-2 border-top">
                        <strong>Total</strong>
                        <span id="totalCarrito">$0.00</span>
                    </div>
                    <div class="d-grid gap-2 col-10 mx-auto mt-4">
                        <button type="button" class="btn btn-outline-success" id="btnPagar">Pagar</button>
                    </div>

                </aside>
            </div>
        </div>
    </div>
    <!-- Alerta de producto eliminado -->
    <div class="position-fixed bottom-0 end-0 p-3">
        <div id="liveToast" class="toast" role="alert">
            <div class="d-flex">
                <div class="toast-body">
                    <img src="./assets/favicon/favicon.svg?v=3" width="25px" height="25px" class="rounded me-2"
                        alt="...">
                    <strong class="me-auto">Articulo eliminado del carrito.</strong>
                </div>
                <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
            </div>

        </div>
    </div>




    <script src="./javascript/navbarAndFooter.js"></script>
    <script src="./javascript/main.js"></script>
    <script src="./javascript/carrito.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-ndDqU0Gzau9qJ1lfW4pNLlhNTkCfHzAVBReH9diLvGRem5+R9g2FzA8ZGN954O5Q"
        crossorigin="anonymous"></script>
</body>

</html>
