<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contacto - AprendeShop</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="./css/styleContacto.css" />
</head>

<body>
  <!-- Encabezado -->
  <div class="text-center py-5 border">
    <h1 class="display-4 fw-bold">AprendeShop</h1>
    <p class="lead">Subtitle</p>
  </div>

  <!-- Sección de contacto -->
  <main class="container my-5">
    <div class="row align-items-center">
      <!-- Texto -->
      <div class="col-lg-6 text-center mb-4 mb-lg-0">
        <h2 class="">Contáctanos</h2>
        <p>¿Tienes dudas?<br>Déjanos tu mensaje</p>
      </div>

      <!-- Formulario -->
      <div class="col-lg-6">
        <div class="card p-4">
          <form>
            <div class="mb-3">
              <label for="iptNombre" class="form-label">Nombre</label>
              <input type="text" class="form-control" id="iptNombre" required />
            </div>

            <div class="mb-3">
              <label for="iptCorreo" class="form-label">Correo electrónico</label>
              <input type="email" class="form-control" id="iptCorreo" required />
            </div>

            <div class="mb-3">
              <label for="iptTel" class="form-label">Teléfono</label>
              <input type="tel" class="form-control" id="iptTel" required />
            </div>

            <div class="mb-3">
              <label for="iptMensaje" class="form-label">Mensaje</label>
              <textarea class="form-control" id="iptMensaje" rows="4" required></textarea>
            </div>

            <button type="submit" class="btn  border w-100">Enviar</button>
          </form>
        </div>
      </div>
    </div>
  </main>

  <!-- sección mapa -->
    <div class="container">
      <div class="row align-items-center py-5 border">
        <div class="col-md-6 mb-3 mb-md-0">
          <!-- imagen del mapa-->
          <div style="width: 100%; height: 200px; background-color: #eaeaea; display: flex; align-items: center; justify-content: center;">
            <span class="text-muted">[Imagen o mapa aquí]</span>
          </div>
        </div>
        <div class="col-md-6">
          <h5>Conócenos</h5>
          <p class="mb-0">Nos encontramos en</p>
          <p class="text-muted">Body text for your whole article or post. We'll put in some lorem ipsum to show how a filled-out page might look.</p>
        </div>
      </div>
    </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
  <script src="./js/contacto.js"></script>
</body>
</html>
