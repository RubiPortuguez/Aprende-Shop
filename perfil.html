<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./css/style.css" />

    <title>Mi perfil</title>
    <link rel="stylesheet" href="./css/navbarAndFooter.css" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />
    <!-- Bootstrap Icons -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css"
      rel="stylesheet"
    />
    <style>
      /* Estilos para el switch con sol y luna */
      .theme-switch {
        display: flex; /* Coloca los elementos en una línea */
        align-items: center; /* Centra verticalmente el sol, el switch y la luna */
        gap: 8px; /* Espacio entre íconos y el switch */
        cursor: pointer; /* Muestra la manita */
      }

      .theme-switch input {
        display: none; /* Oculta el checkbox real*/
      }

      /* barra de switch */
      .theme-switch-label {
        width: 50px;
        height: 25px;
        background-color: #ccc; /* Color gris por defecto (modo claro) */
        border-radius: 25px; /* Bordes */
        position: relative; /* Necesario para posicionar el círculo dentro */
        transition: background-color 0.3s; /* Transición suave del color */
      }

      /* bolita del switch */
      .theme-switch-label::after {
        content: ""; /* Obligatorio para pseudo-elementos */
        width: 21px; /* Tamaño del círculo */
        height: 21px;
        background-color: white; /* Color blanco del círculo */
        border-radius: 50%; /* Para que sea redondo */
        position: absolute; /* Dentro del contenedor */
        top: 2px; /* Espaciado desde arriba */
        left: 2px; /* Espaciado desde la izquierda */
        transition: transform 0.3s; /* Movimiento suave al cambiar de lado */
      }

      .theme-switch input:checked + .theme-switch-label {
        background-color: #444; /* Fondo más oscuro cuando está en modo oscuro */
      }
      .theme-switch input:checked + .theme-switch-label::after {
        transform: translateX(25px); /* Mueve la bolita hacia la derecha */
      }

      .theme-switch .sun {
        color: #f39c12; /* Amarillo cálido para el sol */
        font-size: 1.2rem;
      }
      .theme-switch .moon {
        color: #f1c40f; /* Amarillo brillante para la luna */
        font-size: 1.2rem;
      }
    </style>
  </head>

  <body>
    <header></header>

    <!-- Perfil y switch de dark mode -->
    <section class="container my-5">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Mi perfil</h2>
        <!-- Switch con sol y luna -->
        <label class="theme-switch">
          <i class="bi bi-sun-fill sun"></i>
          <input type="checkbox" id="modeSwitch" />
          <span class="theme-switch-label"></span>
          <i class="bi bi-moon-fill moon"></i>
        </label>
      </div>

      <!-- Card Perfil -->
      <div class="card shadow-sm p-3">
        <div class="row g-3 align-items-center">
          <!-- Foto -->
          <div class="col-auto">
            <img
              src="https://via.placeholder.com/100"
              alt="Foto perfil"
              class="rounded-circle img-fluid"
              style="width: 100px; height: 100px; object-fit: cover"
            />
          </div>
          <!-- Info -->
          <div class="col">
            <h5 class="mb-1">
              <span id="userName">Nombre</span>
              <i
                class="bi bi-pencil-square"
                style="cursor: pointer"
                data-bs-toggle="modal"
                data-bs-target="#editNameModal"
              ></i>
            </h5>
            <p class="mb-1 text-muted" id="userDesc">
              Breve descripción del usuario
              <i
                class="bi bi-pencil-square"
                style="cursor: pointer"
                data-bs-toggle="modal"
                data-bs-target="#editDescModal"
              ></i>
            </p>
            <p class="mb-0 fw-bold">
              Correo electrónico:
              <a href="mailto:email@email.com" id="userEmail"
                >email@email.com</a
              >
              <i
                class="bi bi-pencil-square"
                style="cursor: pointer"
                data-bs-toggle="modal"
                data-bs-target="#editEmailModal"
              ></i>
            </p>
          </div>
        </div>
      </div>
    </section>

    <!-- Wishlist -->
    <section class="container my-5">
      <h3 class="mb-4">Wishlist</h3>
      <div class="row g-4">
        <!-- Curso -->
        <div class="col-12 col-sm-6 col-md-4">
          <div class="card h-100 shadow-sm">
            <img
              src="https://via.placeholder.com/150"
              class="card-img-top"
              alt="Curso 1"
            />
            <div class="card-body">
              <h5 class="card-title">Curso 1</h5>
              <p class="card-text">Pequeña descripción</p>
            </div>
          </div>
        </div>
        <!-- Curso -->
        <div class="col-12 col-sm-6 col-md-4">
          <div class="card h-100 shadow-sm">
            <img
              src="https://via.placeholder.com/150"
              class="card-img-top"
              alt="Curso 2"
            />
            <div class="card-body">
              <h5 class="card-title">Curso 2</h5>
              <p class="card-text">Pequeña descripción</p>
            </div>
          </div>
        </div>
        <!-- Curso -->
        <div class="col-12 col-sm-6 col-md-4">
          <div class="card h-100 shadow-sm">
            <img
              src="https://via.placeholder.com/150"
              class="card-img-top"
              alt="Curso 3"
            />
            <div class="card-body">
              <h5 class="card-title">Curso 3</h5>
              <p class="card-text">Pequeña descripción</p>
            </div>
          </div>
        </div>
      </div>
    </section>

    <!-- Modales para editar información -->
    <!-- Modal Editar Nombre -->
    <div class="modal fade" id="editNameModal" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title">Editar nombre</h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
            ></button>
          </div>
          <div class="modal-body">
            <input
              type="text"
              class="form-control"
              id="userNameInput"
              placeholder="Nuevo nombre"
            />
          </div>
          <div class="modal-footer">
            <button class="btn btn-secondary" data-bs-dismiss="modal">
              Cancelar
            </button>
            <button class="btn btn-primary" id="saveNameBtn">Guardar</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Modal Editar Descripción -->
    <div class="modal fade" id="editDescModal" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title">Editar descripción</h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
            ></button>
          </div>
          <div class="modal-body">
            <textarea
              class="form-control"
              id="userDescInput"
              rows="3"
              placeholder="Nueva descripción"
            ></textarea>
          </div>
          <div class="modal-footer">
            <button class="btn btn-secondary" data-bs-dismiss="modal">
              Cancelar
            </button>
            <button class="btn btn-primary" id="saveDescBtn">Guardar</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Modal Editar Email -->
    <div
      class="modal fade"
      id="editEmailModal"
      tabindex="-1"
      aria-hidden="true"
    >
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title">Editar correo electrónico</h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
            ></button>
          </div>
          <div class="modal-body">
            <input
              type="email"
              class="form-control"
              id="userEmailInput"
              placeholder="Nuevo correo"
            />
          </div>
          <div class="modal-footer">
            <button class="btn btn-secondary" data-bs-dismiss="modal">
              Cancelar
            </button>
            <button class="btn btn-primary" id="saveEmailBtn">Guardar</button>
          </div>
        </div>
      </div>
    </div>

    <footer class="py-5 border-top"></footer>
    <script src="./javascript/main.js"></script>
    <script src="./javascript/navbarAndFooter.js"></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-ndDqU0Gzau9qJ1lfW4pNLlhNTkCfHzAVBReH9diLvGRem5+R9g2FzA8ZGN954O5Q"
      crossorigin="anonymous"
    ></script>

    <!-- Script Dark Mode + Modales -->
    <script>
      const switchMode = document.getElementById("modeSwitch");

      // Aplicar preferencia al cargar con localStorage
      if (localStorage.getItem("theme") === "dark") {
        applyDarkMode(true);
        switchMode.checked = true;
      }

      // Evento cambio de tema
      switchMode.addEventListener("change", () => {
        if (switchMode.checked) {
          applyDarkMode(true);
          localStorage.setItem("theme", "dark");
        } else {
          applyDarkMode(false);
          localStorage.setItem("theme", "light");
        }
      });

      function applyDarkMode(enable) {
        document.body.classList.toggle("bg-dark", enable);
        document.body.classList.toggle("text-white", enable);

        // Tarjetas
        document.querySelectorAll(".card").forEach((card) => {
          card.classList.toggle("bg-dark", enable);
          card.classList.toggle("text-white", enable);
        });

        // Descripción (para que no se quede gris en dark mode)
        document.querySelectorAll("#userDesc").forEach((desc) => {
          if (enable) {
            desc.classList.remove("text-muted");
            desc.classList.add("text-light");
          } else {
            desc.classList.remove("text-light");
            desc.classList.add("text-muted");
          }
        });

        // Íconos de edición (para que se vean en dark mode)
        document.querySelectorAll(".bi-pencil-square").forEach((icon) => {
          if (enable) {
            icon.style.color = "#fff";
          } else {
            icon.style.color = "";
          }
        });
      }

      // Guardar cambios modales
      document.getElementById("saveNameBtn").addEventListener("click", () => {
        const val = document.getElementById("userNameInput").value.trim();
        if (val) document.getElementById("userName").textContent = val;
        bootstrap.Modal.getInstance(
          document.getElementById("editNameModal")
        ).hide();
      });

      document.getElementById("saveDescBtn").addEventListener("click", () => {
        const val = document.getElementById("userDescInput").value.trim();
        if (val)
          document.getElementById("userDesc").firstChild.textContent =
            val + " ";
        bootstrap.Modal.getInstance(
          document.getElementById("editDescModal")
        ).hide();
      });

      document.getElementById("saveEmailBtn").addEventListener("click", () => {
        const val = document.getElementById("userEmailInput").value.trim();
        if (val) {
          document.getElementById("userEmail").textContent = val;
          document.getElementById("userEmail").href = "mailto:" + val;
        }
        bootstrap.Modal.getInstance(
          document.getElementById("editEmailModal")
        ).hide();
      });
    </script>
  </body>
</html>
